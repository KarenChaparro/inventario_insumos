<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICV & CIE Insumos - Sistema de Control</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (xlsx) para exportar e importar archivos Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="app" class="flex-1 flex flex-col">
        <!-- Renderizado dinámico -->
    </div>

    <!-- MODALES -->
    <div id="modal-container"></div>

    <script>
        // --- BASE DE DATOS Y ESTADO ---
        let db = JSON.parse(localStorage.getItem('icv_cie_db_v2')) || {
            users: [
                { name: 'Lindsay Velasco', doc: '27984352', pass: 'admin', role: 'admin' }
            ],
            currentSedetab: 'ICV', // 'ICV' o 'CIE'
            currentSection: 'hospitalarios', // 'hospitalarios' o 'comercializadora'
            currentTab: 'inventario', // 'inventario', 'pedido', ' recepcion', 'reportes'
            currentUser: null,
            orders: [],
            inventory: {
                ICV: {
                    hospitalarios: [
                        { code: 'HOS-001', name: 'Sábanas Planas Blancas', qty: 250 },
                        { code: 'HOS-002', name: 'Batas Quirúrgicas Estériles', qty: 120 },
                        { code: 'HOS-003', name: 'Guantes de Látex Talla M (Caja)', qty: 400 }
                    ],
                    comercializadora: [
                        { code: 'COM-001', name: 'Kits de Aseo Institucional', qty: 85 },
                        { code: 'COM-002', name: 'Termos Metálicos Marcados', qty: 60 }
                    ]
                },
                CIE: {
                    hospitalarios: [
                        { code: 'CIE-H01', name: 'Tapabocas N95 (Caja x 50)', qty: 300 },
                        { code: 'CIE-H02', name: 'Solución Salina 500ml', qty: 150 }
                    ],
                    comercializadora: [
                        { code: 'CIE-C01', name: 'Llantas / Insumos Logística', qty: 30 }
                    ]
                }
            }
        };

        function saveDB() {
            localStorage.setItem('icv_cie_db_v2', JSON.stringify(db));
        }

        window.onload = function() {
            render();
        };

        function render() {
            const app = document.getElementById('app');
            if (!db.currentUser) {
                app.innerHTML = renderLogin();
            } else {
                app.innerHTML = renderDashboard();
            }
        }

        // --- AUTENTICACIÓN ---
        let authMode = 'login';

        function renderLogin() {
            return `
                <div class="flex-1 flex items-center justify-center p-4 bg-slate-100">
                    <div class="bg-white border border-slate-200 p-8 rounded-2xl shadow-xl w-full max-w-md">
                        <div class="text-center mb-8">
                            <div class="bg-indigo-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-600/30">
                                <i class="fa-solid fa-boxes-stacked text-2xl text-white"></i>
                            </div>
                            <h1 class="text-2xl font-bold tracking-tight text-slate-900">ICV & CIE Insumos</h1>
                            <p class="text-xs text-slate-500 mt-1">Sistema de Control de Inventarios y Pedidos</p>
                        </div>

                        <div class="flex bg-slate-100 p-1 rounded-xl mb-6 border border-slate-200">
                            <button onclick="authMode='login'; render()" class="flex-1 py-2 text-xs font-semibold rounded-lg transition ${authMode === 'login' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 hover:text-slate-900'}">Iniciar Sesión</button>
                            <button onclick="authMode='register'; render()" class="flex-1 py-2 text-xs font-semibold rounded-lg transition ${authMode === 'register' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 hover:text-slate-900'}">Registrarse</button>
                        </div>

                        ${authMode === 'login' ? `
                            <form onsubmit="handleLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">USUARIO O DOCUMENTO</label>
                                    <div class="relative">
                                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-user"></i></span>
                                        <input type="text" id="login-user" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:border-indigo-600" placeholder="usuario o Documento">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Contraseña</label>
                                    <div class="relative">
                                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-lock"></i></span>
                                        <input type="password" id="login-pass" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:border-indigo-600" placeholder="••••••••">
                                    </div>
                                </div>
                                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition">
                                    Entrar al Sistema
                                </button>
                            </form>
                        ` : `
                            <form onsubmit="handleRegister(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Nombre Completo</label>
                                    <input type="text" id="reg-name" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:border-indigo-600" placeholder="Tu nombre">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Número de Documento</label>
                                    <input type="text" id="reg-doc" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:border-indigo-600" placeholder="Número de documento">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Contraseña</label>
                                    <input type="password" id="reg-pass" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:border-indigo-600" placeholder="••••••••">
                                </div>
                                <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-lg shadow-emerald-600/30 transition">
                                    Registrarse
                                </button>
                            </form>
                        `}
                    </div>
                </div>
            `;
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();

            if ((u.toLowerCase() === 'lindsayvelasco' || u === '27984352') && p === 'admin') {
                db.currentUser = { name: 'Lindsay Velasco', role: 'admin', doc: '27984352' };
                saveDB();
                render();
                return;
            }

            const found = db.users.find(x => (x.name.toLowerCase() === u.toLowerCase() || x.doc === u) && x.pass === p);
            if (found) {
                db.currentUser = found;
                saveDB();
                render();
            } else {
                alert('Usuario o contraseña incorrectos.');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const doc = document.getElementById('reg-doc').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();

            if (db.users.some(x => x.doc === doc)) {
                alert('Ya existe un usuario registrado con este número de documento.');
                return;
            }

            const newUser = { name, doc, pass, role: 'user' };
            db.users.push(newUser);
            db.currentUser = newUser;
            saveDB();
            alert('¡Usuario registrado con éxito!');
            render();
        }

        function logout() {
            db.currentUser = null;
            saveDB();
            render();
        }

        // --- DASHBOARD PRINCIPAL ---
        function renderDashboard() {
            const isAdmin = db.currentUser.role === 'admin';

            return `
                <!-- Navbar Superior -->
                <header class="bg-white border-b border-slate-200 px-6 py-4 flex flex-wrap justify-between items-center gap-4 shadow-sm">
                    <div class="flex items-center space-x-3">
                        <div class="bg-indigo-600 text-white p-2.5 rounded-xl font-bold"><i class="fa-solid fa-boxes-stacked"></i></div>
                        <div>
                            <h2 class="font-bold text-slate-900 text-base">ICV & CIE Insumos</h2>
                            <p class="text-xs text-slate-500">Gestión Multisede</p>
                        </div>
                    </div>

                    <div class="flex items-center space-x-3">
                        ${isAdmin ? `<button onclick="openChangePasswordModal()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition"><i class="fa-solid fa-key mr-1.5"></i> Cambiar Contraseña</button>` : ''}
                        <div class="flex items-center space-x-2 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200">
                            <i class="fa-solid fa-user-shield text-indigo-600"></i>
                            <div class="text-xs">
                                <p class="font-bold text-slate-800">${db.currentUser.name}</p>
                                <p class="text-[10px] text-slate-500 uppercase">${isAdmin ? 'Administrador' : 'Usuario'}</p>
                            </div>
                        </div>
                        <button onclick="logout()" class="p-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl transition" title="Cerrar Sesión"><i class="fa-solid fa-power-off"></i></button>
                    </div>
                </header>

                <!-- Barra de Sede y Sección -->
                <div class="bg-indigo-900 text-white px-6 py-3 flex flex-wrap justify-between items-center gap-4 shadow">
                    <div class="flex items-center space-x-3">
                        <span class="text-xs font-bold uppercase tracking-wider text-indigo-200">SEDE:</span>
                        <div class="flex space-x-2">
                            <button onclick="setSede('ICV')" class="px-4 py-1.5 rounded-lg text-xs font-bold transition ${db.currentSedetab === 'ICV' ? 'bg-white text-indigo-900 shadow' : 'bg-indigo-800 text-indigo-200 hover:bg-indigo-700'}">Sede ICV</button>
                            <button onclick="setSede('CIE')" class="px-4 py-1.5 rounded-lg text-xs font-bold transition ${db.currentSedetab === 'CIE' ? 'bg-white text-indigo-900 shadow' : 'bg-indigo-800 text-indigo-200 hover:bg-indigo-700'}">Sede CIE</button>
                        </div>
                    </div>

                    <div class="flex items-center space-x-3">
                        <span class="text-xs font-bold uppercase tracking-wider text-indigo-200">SECCIÓN:</span>
                        <div class="flex space-x-2">
                            <button onclick="setSection('hospitalarios')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition ${db.currentSection === 'hospitalarios' ? 'bg-white text-indigo-900 shadow' : 'bg-indigo-800 text-indigo-200 hover:bg-indigo-700'}"><i class="fa-solid fa-hospital mr-1"></i> Productos Hospitalarios</button>
                            <button onclick="setSection('comercializadora')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition ${db.currentSection === 'comercializadora' ? 'bg-white text-indigo-900 shadow' : 'bg-indigo-800 text-indigo-200 hover:bg-indigo-700'}"><i class="fa-solid fa-store mr-1"></i> Comercializadora</button>
                        </div>
                    </div>
                </div>

                <!-- Pestañas Principales (Navbar Interna) -->
                <div class="bg-white border-b border-slate-200 px-6 flex space-x-6">
                    <button onclick="setTab('inventario')" class="py-3.5 border-b-2 text-xs font-bold transition flex items-center space-x-2 ${db.currentTab === 'inventario' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800'}">
                        <i class="fa-solid fa-warehouse"></i><span>Inventario Actual</span>
                    </button>
                    <button onclick="setTab('pedido')" class="py-3.5 border-b-2 text-xs font-bold transition flex items-center space-x-2 ${db.currentTab === 'pedido' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800'}">
                        <i class="fa-solid fa-cart-shopping"></i><span>Realizar Pedido</span>
                    </button>
                    <button onclick="setTab('recepcion')" class="py-3.5 border-b-2 text-xs font-bold transition flex items-center space-x-2 ${db.currentTab === 'recepcion' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800'}">
                        <i class="fa-solid fa-truck-ramp-box"></i><span>Recepción y Pendientes</span>
                    </button>
                    ${isAdmin ? `
                        <button onclick="setTab('reportes')" class="py-3.5 border-b-2 text-xs font-bold transition flex items-center space-x-2 ${db.currentTab === 'reportes' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800'}">
                            <i class="fa-solid fa-chart-pie"></i><span>Panel Admin & Reportes</span>
                        </button>
                    ` : ''}
                </div>

                <!-- CONTENIDO DE LAS PESTAÑAS -->
                <div class="flex-1 p-6 max-w-7xl mx-auto w-full">
                    ${db.currentTab === 'inventario' ? renderInventoryTab() : ''}
                    ${db.currentTab === 'pedido' ? renderOrderTab() : ''}
                    ${db.currentTab === 'recepcion' ? renderReceptionTab() : ''}
                    ${db.currentTab === 'reportes' && isAdmin ? renderReportsTab() : ''}
                </div>
            `;
        }

        function setSede(sede) {
            db.currentSedetab = sede;
            saveDB();
            render();
        }

        function setSection(sec) {
            db.currentSection = sec;
            saveDB();
            render();
        }

        function setTab(tab) {
            db.currentTab = tab;
            saveDB();
            render();
        }

        // --- PESTAÑA 1: INVENTARIO ACTUAL ---
        function renderInventoryTab() {
            const isAdmin = db.currentUser.role === 'admin';
            const inv = db.inventory[db.currentSedetab][db.currentSection];

            return `
                <div class="space-y-6">
                    <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-2xl flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-slate-800">Vista Actual: Sede ${db.currentSedetab} / Sección ${db.currentSection.toUpperCase()}</h3>
                            <p class="text-xs text-slate-500">Los datos mostrados corresponden exclusivamente a esta selección.</p>
                        </div>
                        ${isAdmin ? `
                            <div class="flex gap-2">
                                <button onclick="openAddProductModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl shadow transition"><i class="fa-solid fa-plus mr-1.5"></i> Agregar Insumo</button>
                                <button onclick="openBulkUploadModal()" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-700 text-white text-xs font-bold rounded-xl shadow transition"><i class="fa-solid fa-file-excel mr-1.5"></i> Carga Masiva</button>
                            </div>
                        ` : ''}
                    </div>

                    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                        <div class="p-4 border-b border-slate-200 flex justify-between items-center">
                            <h3 class="font-bold text-slate-800">Lista de Insumos Disponibles</h3>
                            <span class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full font-semibold">${inv.length} ítems</span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="border-b border-slate-200 text-slate-400 text-xs uppercase tracking-wider bg-slate-50">
                                        <th class="py-3 px-4">Código</th>
                                        <th class="py-3 px-4">Nombre del Insumo</th>
                                        <th class="py-3 px-4">Cantidad Disponible</th>
                                        ${isAdmin ? `<th class="py-3 px-4 text-right">Acciones</th>` : ''}
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-sm">
                                    ${inv.length === 0 ? `
                                        <tr><td colspan="${isAdmin ? 4 : 3}" class="text-center py-8 text-slate-400">No hay insumos registrados en esta sección.</td></tr>
                                    ` : inv.map((item, idx) => `
                                        <tr class="hover:bg-slate-50/80 transition">
                                            <td class="py-3.5 px-4 font-mono text-indigo-600 font-semibold">${item.code}</td>
                                            <td class="py-3.5 px-4 text-slate-800">${item.name}</td>
                                            <td class="py-3.5 px-4"><span class="px-2.5 py-1 bg-slate-100 rounded-lg font-bold ${item.qty > 10 ? 'text-emerald-600' : 'text-amber-600'}">${item.qty} unids</span></td>
                                            ${isAdmin ? `
                                                <td class="py-3.5 px-4 text-right space-x-2">
                                                    <button onclick="editItem(${idx})" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition"><i class="fa-solid fa-pen mr-1"></i> Modificar</button>
                                                    <button onclick="deleteItem(${idx})" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-semibold rounded-lg transition"><i class="fa-solid fa-trash mr-1"></i> Eliminar</button>
                                                </td>
                                            ` : ''}
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- PESTAÑA 2: REALIZAR PEDIDO ---
        let currentOrderItems = [];

        function renderOrderTab() {
            const inv = db.inventory[db.currentSedetab][db.currentSection];

            return `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4">
                        <h3 class="font-bold text-slate-800">Seleccionar Insumos para Pedido</h3>
                        <p class="text-xs text-slate-500">Busca por código o nombre y añade las cantidades necesarias.</p>
                        
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-magnifying-glass"></i></span>
                            <input type="text" id="order-search" oninput="filterOrderItems()" placeholder="Buscar insumo por nombre o código..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600">
                        </div>

                        <div id="order-search-results" class="space-y-2 max-h-96 overflow-y-auto">
                            ${inv.map(item => `
                                <div class="flex justify-between items-center p-3 border border-slate-100 hover:bg-slate-50 rounded-xl transition text-xs">
                                    <div>
                                        <span class="font-mono text-indigo-600 font-bold">${item.code}</span>
                                        <p class="font-semibold text-slate-800 mt-0.5">${item.name}</p>
                                        <p class="text-[10px] text-slate-400">Disponible: ${item.qty}</p>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <input type="number" id="qty-${item.code}" min="1" value="1" class="w-16 px-2 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-center font-bold">
                                        <button onclick="addOrderItemSelected('${item.code}', '${item.name}')" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-semibold transition"><i class="fa-solid fa-plus mr-1"></i> Añadir</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex flex-col justify-between space-y-4">
                        <div>
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="font-bold text-slate-800">Carrito de Pedido</h3>
                                <span class="text-xs bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full font-bold">${currentOrderItems.length} ítems</span>
                            </div>
                            <div id="selected-order-list" class="space-y-2 max-h-72 overflow-y-auto">
                                ${currentOrderItems.length === 0 ? `
                                    <div class="text-center py-12 text-slate-400">
                                        <i class="fa-solid fa-cart-shopping text-3xl mb-2 text-slate-300"></i>
                                        <p class="text-xs">No hay insumos agregados al pedido actual.</p>
                                    </div>
                                ` : currentOrderItems.map((item, idx) => `
                                    <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl text-xs border border-slate-200">
                                        <div>
                                            <span class="font-mono text-indigo-600 font-bold">${item.code}</span>
                                            <p class="font-semibold text-slate-800">${item.name}</p>
                                        </div>
                                        <div class="flex items-center gap-3">
                                            <span class="bg-indigo-100 text-indigo-700 px-2 py-1 rounded-lg font-bold">${item.qtyRequested} sol.</span>
                                            <button onclick="currentOrderItems.splice(${idx}, 1); render()" class="text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash"></i></button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <button onclick="submitOrder()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-600/30 transition flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-paper-plane"></i><span>Realizar Pedido Oficial</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function filterOrderItems() {
            const query = document.getElementById('order-search').value.toLowerCase();
            const inv = db.inventory[db.currentSedetab][db.currentSection];
            const container = document.getElementById('order-search-results');
            const filtered = inv.filter(i => i.code.toLowerCase().includes(query) || i.name.toLowerCase().includes(query));

            container.innerHTML = filtered.map(item => `
                <div class="flex justify-between items-center p-3 border border-slate-100 hover:bg-slate-50 rounded-xl transition text-xs">
                    <div>
                        <span class="font-mono text-indigo-600 font-bold">${item.code}</span>
                        <p class="font-semibold text-slate-800 mt-0.5">${item.name}</p>
                        <p class="text-[10px] text-slate-400">Disponible: ${item.qty}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="number" id="qty-${item.code}" min="1" value="1" class="w-16 px-2 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-center font-bold">

            const newOrder = {

                        </div>

                        <div class="flex justify-end space-x-3 pt-4 border-t border-slate-200">
                            <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-xs font-semibold rounded-xl transition">Cancelar</button>
                            <button onclick="processBulkUpload()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-xs font-semibold rounded-xl text-white transition">Cargar Insumos</button>
                        </div>
                    </div>
                </div>
            `;

        function downloadTemplate() {
            const templateData = [
                { Código: "HOS-100", Nombre: "Ejemplo Insumo 1" },
                { Código: "HOS-101", Nombre: "Ejemplo Insumo 2" }
            ];
            const ws = XLSX.utils.json_to_sheet(templateData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Plantilla");
            XLSX.writeFile(wb, "Plantilla_Carga_Masiva_Insumos.xlsx");
        }

        function processBulkUpload() {
            const fileInput = document.getElementById('bulk-file');
            if (!fileInput.files || fileInput.files.length === 0) {
                alert('Por favor selecciona un archivo Excel.');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(worksheet);

                    let addedCount = 0;
                    const currentList = db.inventory[db.currentSedetab][db.currentSection];

                    json.forEach(row => {
                        const code = row['Código'] || row['Codigo'] || row['code'] || row['CÓDIGO'];
                        const name = row['Nombre'] || row['nombre'] || row['NAME'] || row['Insumo'];

                        if (code && name) {
                            const codeStr = String(code).trim();
                            const nameStr = String(name).trim();
                            if (!currentList.some(i => i.code === codeStr)) {
                                currentList.push({ code: codeStr, name: nameStr, qty: 0 });
                                addedCount++;
                            }
                        }
                    });

                    saveDB();
                    closeModal();
                    alert(`¡Carga masiva exitosa! Se agregaron ${addedCount} nuevos insumos con cantidad 0.`);
                    render();
                } catch (err) {
                    console.error(err);
                    alert('Error al leer el archivo Excel. Asegúrate de que tenga las columnas correctas.');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function saveIncomingShipment(orderId) {
            const order = db.orders.find(o => o.id === orderId);

            order.items.forEach((i, idx) => {
                const incomingVal = parseInt(document.getElementById(`incoming-${idx}`).value) || 0;
                if (incomingVal > 0) {
                    i.qtyPending = Math.max(0, i.qtyPending - incomingVal);
                    const invList = db.inventory[order.sede][order.section];
                    const prod = invList.find(p => p.code === i.code);
                    if (prod) prod.qty += incomingVal;
                }
            });

            order.status = order.items.every(i => i.qtyPending === 0) ? 'Completado' : 'Pendiente Parcial';
            saveDB();
            closeModal();
            alert('¡Recepción registrada e inventario actualizado con éxito!');

                    <div class="bg-white border border-slate-200 p-6 rounded-2xl w-full max-w-2xl space-y-4 max-h-[90vh] overflow-y-auto shadow-xl">
                        <div class="flex justify-between items-center">
                            <h3 class="text-lg font-bold text-slate-800">Total Pedidos Realizados (Por Mes)</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <p class="text-xs text-slate-500">Selecciona un mes para ver las órdenes ordenadas de la más reciente a la más antigua.</p>

                        <div class="space-y-3">
                            ${Object.keys(monthsMap).length === 0 ? `<p class="text-xs text-slate-400 text-center py-4">No hay pedidos registrados.</p>` : Object.keys(monthsMap).sort().reverse().map(m => `
                                <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl">
                                    <h4 class="font-bold text-sm text-indigo-600 mb-2">📅 Mes: ${m} (${monthsMap[m].length} órdenes)</h4>
                                    <div class="space-y-2">
                                        ${monthsMap[m].sort((a,b) => new Date(b.date + ' ' + b.time) - new Date(a.date + ' ' + a.time)).map(o => `
                                            <div class="flex justify-between items-center bg-white p-3 rounded-lg text-xs border border-slate-100">
                                                <div>
                                                    <span class="font-mono text-indigo-600 font-bold">${o.id}</span>
                                                    <p class="font-semibold text-slate-800">${o.userName} - ${o.date} (${o.sede})</p>
                                                </div>
                                                <button onclick="closeModal(); openOrderDetail('${o.id}')" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded font-semibold">Ver insumos ></button>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="flex justify-end pt-4 border-t border-slate-200">
                            <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition">Cerrar</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function openMonthlyAverageModal() {
            const monthsMap = {};
            db.orders.forEach(o => {
                const m = o.date.substring(0, 7);
                if (!monthsMap[m]) monthsMap[m] = [];
                monthsMap[m].push(o);
            });

            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div class="bg-white border border-slate-200 p-6 rounded-2xl w-full max-w-2xl space-y-4 max-h-[90vh] overflow-y-auto shadow-xl">
                        <div class="flex justify-between items-center">
                            <h3 class="text-lg font-bold text-slate-800">Promedio y Detalle Mensual</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <p class="text-xs text-slate-500">Haz clic en un mes para ver el detalle de los insumos solicitados y descargar su Excel (.xlsx).</p>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            ${Object.keys(monthsMap).length === 0 ? `<p class="text-xs text-slate-400 col-span-2 text-center py-4">No hay datos mensuales.</p>` : Object.keys(monthsMap).sort().reverse().map(m => `
                                <div onclick="openMonthDetailModal('${m}')" class="bg-slate-50 border border-slate-200 hover:border-indigo-600 p-4 rounded-xl cursor-pointer transition">
                                    <h4 class="font-bold text-sm text-indigo-600 mb-1">📅 ${m}</h4>
                                    <p class="text-xs text-slate-500">${monthsMap[m].length} pedidos realizados</p>
                                </div>
                            `).join('')}
                        </div>

                        <div class="flex justify-end pt-4 border-t border-slate-200">
                            <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition">Cerrar</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function openMonthDetailModal(monthStr) {
            const ordersInMonth = db.orders.filter(o => o.date.startsWith(monthStr));
            const aggregated = {};
            ordersInMonth.forEach(o => {
                o.items.forEach(i => {
                    if (!aggregated[i.code]) aggregated[i.code] = { code: i.code, name: i.name, totalQty: 0, requestsCount: 0 };
                    aggregated[i.code].totalQty += i.qtyRequested;
                    aggregated[i.code].requestsCount += 1;
                });
            });

            const itemsArray = Object.values(aggregated);

            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div class="bg-white border border-slate-200 p-6 rounded-2xl w-full max-w-xl space-y-4 max-h-[90vh] overflow-y-auto shadow-xl">
                        <div class="flex justify-between items-center">
                            <h3 class="text-lg font-bold text-slate-800">Detalle del Mes: ${monthStr}</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>

                        <div class="space-y-2">
                            ${itemsArray.length === 0 ? `<p class="text-xs text-slate-400 text-center py-4">No hay insumos en este mes.</p>` : itemsArray.map(i => `
                                <div class="bg-slate-50 border border-slate-200 p-3 rounded-xl flex justify-between items-center text-xs">
                                    <div>
                                        <span class="font-mono text-indigo-600 font-bold">${i.code}</span>
                                        <p class="font-semibold text-slate-800">${i.name}</p>
                                    </div>
                                    <div class="text-right">
                                        <span class="bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-lg font-bold">${i.totalQty} solicitados</span>
                                        <p class="text-slate-400 mt-1">(${i.requestsCount} veces pedido)</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="flex justify-between items-center pt-4 border-t border-slate-200">
                            <button onclick="downloadMonthExcel('${monthStr}')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-xs font-semibold rounded-xl text-white transition"><i class="fa-solid fa-file-excel mr-1.5"></i> Descargar Excel (.xlsx)</button>
                            <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition">Cerrar</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function downloadMonthExcel(monthStr) {
            const ordersInMonth = db.orders.filter(o => o.date.startsWith(monthStr));
            const aggregated = {};
            ordersInMonth.forEach(o => {
                o.items.forEach(i => {
                    if (!aggregated[i.code]) aggregated[i.code] = { code: i.code, name: i.name, totalQty: 0, requestsCount: 0 };
                    aggregated[i.code].totalQty += i.qtyRequested;
                    aggregated[i.code].requestsCount += 1;
                });
            });

            const data = Object.values(aggregated).map(i => ({
                "Código": i.code,
                "Nombre del Insumo": i.name,
                "Total Solicitado": i.totalQty,
                "Veces Solicitado": i.requestsCount
            }));

            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, `Mes_${monthStr}`);
            XLSX.writeFile(wb, `Reporte_Mensual_${monthStr}.xlsx`);
        }

        function openAnnualModal() {
            const monthsMap = {};
            db.orders.forEach(o => {
                const m = o.date.substring(0, 7);
                if (!monthsMap[m]) monthsMap[m] = [];
                monthsMap[m].push(o);
            });

            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div class="bg-white border border-slate-200 p-6 rounded-2xl w-full max-w-2xl space-y-4 max-h-[90vh] overflow-y-auto shadow-xl">
                        <div class="flex justify-between items-center">
                            <h3 class="text-lg font-bold text-slate-800">Relacionado Anual y por Meses</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <p class="text-xs text-slate-500">Desglose mensual y acumulado anual de los insumos solicitados.</p>

                        <div class="space-y-4">
                            ${Object.keys(monthsMap).length === 0 ? `<p class="text-xs text-slate-400 text-center py-4">No hay pedidos registrados este año.</p>` : Object.keys(monthsMap).sort().reverse().map(m => {
                                const agg = {};
                                monthsMap[m].forEach(o => {
                                    o.items.forEach(i => {
                                        if (!agg[i.code]) agg[i.code] = { name: i.name, qty: 0 };
                                        agg[i.code].qty += i.qtyRequested;
                                    });
                                });
                                return `
                                    <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl space-y-2">
                                        <h4 class="font-bold text-sm text-indigo-600">📅 Mes: ${m}</h4>
                                        <div class="space-y-1">
                                            ${Object.keys(agg).map(code => `
                                                <div class="flex justify-between text-xs bg-white p-2 rounded border border-slate-100">
                                                    <span><strong class="text-indigo-600">${code}</strong> - ${agg[code].name}</span>
                                                    <span class="font-bold">${agg[code].qty} unidades</span>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        <div class="flex justify-between items-center pt-4 border-t border-slate-200">
                            <button onclick="downloadAnnualExcel()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-xs font-semibold rounded-xl text-white transition"><i class="fa-solid fa-file-excel mr-1.5"></i> Descargar Relacionado Anual (.xlsx)</button>
                            <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition">Cerrar</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function downloadAnnualExcel() {
            const aggregated = {};
            db.orders.forEach(o => {
                const m = o.date.substring(0, 7);
                o.items.forEach(i => {
                    const key = m + '_' + i.code;
                    if (!aggregated[key]) {
                        aggregated[key] = { Mes: m, Código: i.code, Nombre: i.name, CantidadTotal: 0 };
                    }
                    aggregated[key].CantidadTotal += i.qtyRequested;
                });
            });

            const data = Object.values(aggregated);
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "RelacionAnual");
            XLSX.writeFile(wb, "Relacion_Anual_Insumos.xlsx");
        }

        function openChangePasswordModal() {
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div class="bg-white border border-slate-200 p-6 rounded-2xl w-full max-w-md space-y-4 shadow-xl">
                        <div class="flex justify-between items-center">
                            <h3 class="text-lg font-bold text-slate-800">Cambiar Contraseña de Administrador</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <form onsubmit="saveNewPassword(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Nueva Contraseña</label>
                                <input type="password" id="new-admin-pass" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600" placeholder="Nueva contraseña">
                            </div>
                            <div class="flex justify-end space-x-3 pt-4 border-t border-slate-200">
                                <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition">Cancelar</button>
                                <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-xs font-semibold rounded-xl text-white transition">Actualizar Contraseña</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function saveNewPassword(e) {
            e.preventDefault();
            const pass = document.getElementById('new-admin-pass').value.trim();
            let adminUser = db.users.find(u => u.role === 'admin');
            if (adminUser) {
                adminUser.pass = pass;
            } else {
                db.users.push({ name: 'Lindsay Velasco', doc: '27984352', pass: pass, role: 'admin' });
            }
            saveDB();
            closeModal();
            alert('¡Contraseña de administrador actualizada con éxito!');
        }

        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
        }
    </script>
</body>
</html>
