<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Integral de Inventarios ICV & CIE</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SheetJS para Carga Masiva y Exportación Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="flex-1 flex flex-col">
        <!-- Rendered dynamically via JS -->
    </div>

    <!-- MODALS CONTAINER -->
    <div id="modal-container"></div>

    <!-- APPLICATION JAVASCRIPT -->
    <script>
        // --- INITIAL STATE & LOCALSTORAGE MANAGEMENT ---

        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx7vBlpxwZ3_uF_b7Xez1C1q21188ie1qZqahLb3TSiq_CUeMgFvQjrO5FQNobiBdVo4Q/exec

async function syncOrderToCloud(orderData) {
    try {
        await fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: 'saveOrder',
                ...orderData
            })
        });
        showToast('¡Pedido sincronizado en la nube (Google Sheets)!', 'success');
    } catch (err) {
        console.error("Error al sincronizar con la nube:", err);
        showToast('Guardado localmente en este dispositivo.', 'info');
    }
}
        const STORAGE_KEY = 'icv_cie_inventory_system_v5';

        let defaultState = {
            currentUser: null, 
            currentLocation: 'ICV', // 'ICV' or 'CIE'
            currentSection: 'hospitalarios', // 'hospitalarios' or 'comercializadora'
            currentTab: 'inventario', // 'inventario' | 'pedido' | 'seguimiento' | 'reportes'
            users: [
                { name: 'Lindsay Velasco', username: 'lindsayvelasco', document: '27984352', password: 'admin', role: 'admin' }
            ],
            inventory: {
                ICV: {
                    hospitalarios: [
                        { code: 'HOS-001', name: 'Sábanas Planas Blancas', quantity: 200, minStock: 50 },
                        { code: 'HOS-002', name: 'Batas Quirúrgicas Estériles', quantity: 150, minStock: 30 },
                        { code: 'HOS-003', name: 'Guantes de Látex Talla M (Caja)', quantity: 300, minStock: 100 }
                    ],
                    comercializadora: [
                        { code: 'COM-001', name: 'Alcohol Antiséptico 70% (Litro)', quantity: 400, minStock: 80 },
                        { code: 'COM-002', name: 'Tapabocas Triple Capa (Caja x50)', quantity: 500, minStock: 120 }
                    ]
                },
                CIE: {
                    hospitalarios: [
                        { code: 'HOS-101', name: 'Camillas Clínicas Hidráulicas', quantity: 15, minStock: 3 },
                        { code: 'HOS-102', name: 'Monitores de Signos Vitales', quantity: 8, minStock: 2 }
                    ],
                    comercializadora: [
                        { code: 'COM-101', name: 'Gel Antibacterial 1000ml', quantity: 250, minStock: 50 },
                        { code: 'COM-102', name: 'Jeringas 10ml con Aguja (Caja x100)', quantity: 180, minStock: 40 }
                    ]
                }
            },
            orders: [], 
            notifications: [], 
            cart: []
        };

        let state = loadState();

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    let mergedState = { ...defaultState, ...parsed };
                    if (!mergedState.users.some(u => u.document === '27984352')) {
                        mergedState.users.unshift({ name: 'Lindsay Velasco', username: 'lindsayvelasco', document: '27984352', password: 'admin', role: 'admin' });
                    }
                    return mergedState;
                } catch(e) {
                    console.error("Error loading state", e);
                }
            }
            return defaultState;
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        // --- TOAST NOTIFICATIONS ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            const bgColors = {
                success: 'bg-emerald-600 text-white',
                error: 'bg-rose-600 text-white',
                info: 'bg-blue-600 text-white'
            };
            toast.className = `px-4 py-3 rounded-xl shadow-lg font-medium text-sm flex items-center gap-3 transition transform translate-y-2 opacity-0 pointer-events-auto ${bgColors[type] || bgColors.success}`;
            
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-triangle-exclamation',
                info: 'fa-circle-info'
            };

            toast.innerHTML = `<i class="fa-solid ${icons[type]} text-lg"></i> <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // --- RENDER ROUTER ---
        function render() {
            const app = document.getElementById('app');
            if (!state.currentUser) {
                app.innerHTML = renderAuthScreen();
            } else {
                app.innerHTML = renderMainDashboard();
            }
        }

        // --- AUTH SCREEN ---
        let authMode = 'login'; // 'login' or 'register'

        function renderAuthScreen() {
            return `
                <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900">
                    <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl w-full max-w-md p-8 border border-white/20">
                        <div class="text-center mb-8">
                            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600 text-white text-2xl shadow-lg mb-4">
                                <i class="fa-solid fa-boxes-stacked"></i>
                            </div>
                            <h1 class="text-2xl font-bold text-slate-900">ICV & CIE Insumos</h1>
                            <p class="text-slate-500 text-sm mt-1">Sistema de Control de Inventarios y Pedidos</p>
                        </div>

                        <!-- Tabs -->
                        <div class="flex rounded-xl bg-slate-100 p-1 mb-6">
                            <button onclick="setAuthMode('login')" class="flex-1 py-2 text-sm font-semibold rounded-lg transition ${authMode === 'login' ? 'bg-white text-indigo-600 shadow' : 'text-slate-600 hover:text-slate-900'}">Iniciar Sesión</button>
                            <button onclick="setAuthMode('register')" class="flex-1 py-2 text-sm font-semibold rounded-lg transition ${authMode === 'register' ? 'bg-white text-indigo-600 shadow' : 'text-slate-600 hover:text-slate-900'}">Registrarse</button>
                        </div>

                        ${authMode === 'login' ? renderLoginForm() : renderRegisterForm()}
                    </div>
                </div>
            `;
        }

        function renderLoginForm() {
            return `
                <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Usuario o Documento</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-user"></i></span>
                            <input type="text" id="login-id" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:border-indigo-600 focus:bg-white transition" placeholder="Usuario o Documento">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Contraseña</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="login-pass" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:border-indigo-600 focus:bg-white transition" placeholder="••••••••">
                        </div>
                    </div>
                    <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition">
                        Entrar al Sistema
                    </button>
                </form>
            `;
        }

        function renderRegisterForm() {
            return `
                <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Nombre Completo</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-user"></i></span>
                            <input type="text" id="reg-name" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:border-indigo-600 focus:bg-white transition" placeholder="Tu Nombre">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Documento de Identidad</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-id-card"></i></span>
                            <input type="text" id="reg-doc" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:border-indigo-600 focus:bg-white transition" placeholder="Ej. 10987654">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Contraseña</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="reg-pass" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:border-indigo-600 focus:bg-white transition" placeholder="••••••••">
                        </div>
                    </div>
                    <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-lg shadow-emerald-600/30 transition">
                        Registrarme
                    </button>
                </form>
            `;
        }

        function setAuthMode(mode) {
            authMode = mode;
            render();
        }

        function handleLogin(e) {
            e.preventDefault();
            const inputId = document.getElementById('login-id').value.trim().toLowerCase();
            const pass = document.getElementById('login-pass').value.trim();

            if (inputId === '27984352' && pass === 'admin') {
                let adminUser = state.users.find(u => u.document === '27984352');
                if (!adminUser) {
                    adminUser = { name: 'Lindsay Velasco', username: 'lindsayvelasco', document: '27984352', password: 'admin', role: 'admin' };
                    state.users.push(adminUser);
                }
                state.currentUser = adminUser;
                saveState();
                showToast(`¡Bienvenida de nuevo, ${adminUser.name}!`);
                render();
                return;
            }

            const found = state.users.find(u => {
                const matchDoc = u.document && u.document.toLowerCase() === inputId;
                const matchUser = u.username && u.username.toLowerCase() === inputId;
                return (matchDoc || matchUser) && u.password === pass;
            });

            if (found) {
                state.currentUser = found;
                saveState();
                showToast(`¡Bienvenido de nuevo, ${found.name}!`);
                render();
            } else {
                showToast('Usuario/Documento o contraseña incorrectos.', 'error');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const doc = document.getElementById('reg-doc').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();

            if (state.users.some(u => u.document === doc)) {
                showToast('Ya existe un usuario registrado con este documento.', 'error');
                return;
            }

            const newUser = { name, username: name.toLowerCase().replace(/\s+/g, ''), document: doc, password: pass, role: 'user' };
            state.users.push(newUser);
            state.currentUser = newUser;
            saveState();
            showToast('¡Registro exitoso! Sesión iniciada.');
            render();
        }

        function logout() {
            state.currentUser = null;
            saveState();
            showToast('Sesión cerrada correctamente.', 'info');
            render();
        }

        // --- MAIN DASHBOARD ---
        function renderMainDashboard() {
            const isAdmin = state.currentUser.role === 'admin';
            const unreadNotifs = state.notifications.filter(n => !n.read).length;

            return `
                <!-- Top Navbar -->
                <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow-md shadow-indigo-600/20">
                                <i class="fa-solid fa-boxes-stacked"></i>
                            </div>
                            <div>
                                <h1 class="font-bold text-slate-800 text-base leading-tight">ICV & CIE Insumos</h1>
                                <span class="text-xs text-slate-500 font-medium">Gestión Multisede</span>
                            </div>
                        </div>

                        <div class="flex items-center gap-3">
                            ${isAdmin ? `
                            <button onclick="openChangePasswordModal()" class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-indigo-50 text-indigo-700 hover:bg-indigo-100 text-xs font-semibold transition">
                                <i class="fa-solid fa-key"></i> Cambiar Contraseña
                            </button>
                            ` : ''}

                            <!-- User Badge -->
                            <div class="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-xl">
                                <div class="w-7 h-7 rounded-lg bg-indigo-100 text-indigo-700 flex items-center justify-center font-semibold text-xs">
                                    <i class="fa-solid fa-user"></i>
                                </div>
                                <div class="text-xs">
                                    <p class="font-bold text-slate-700">${state.currentUser.name}</p>
                                    <p class="text-slate-500 uppercase tracking-wider text-[10px]">${isAdmin ? 'Administrador (27984352)' : 'Usuario Normal'}</p>
                                </div>
                            </div>

                            <!-- Logout Button -->
                            <button onclick="logout()" title="Cerrar Sesión" class="p-2.5 rounded-xl bg-slate-100 hover:bg-rose-50 hover:text-rose-600 text-slate-600 transition">
                                <i class="fa-solid fa-power-off"></i>
                            </button>
                        </div>
                    </div>
                </header>

                <!-- Sub-Header Sede & Seccion Bar -->
                <div class="bg-indigo-900 text-white shadow-inner">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                        <!-- Sede Toggle -->
                        <div class="flex items-center gap-2">
                            <span class="text-xs uppercase tracking-wider text-indigo-300 font-semibold mr-1">Sede:</span>
                            <button onclick="switchLocation('ICV')" class="px-4 py-2 rounded-xl text-sm font-bold transition shadow-sm ${state.currentLocation === 'ICV' ? 'bg-white text-indigo-950' : 'bg-indigo-800 text-indigo-200 hover:bg-indigo-700'}">
                                <i class="fa-solid fa-hospital mr-1.5"></i> Sede ICV
                            </button>
                            <button onclick="switchLocation('CIE')" class="px-4 py-2 rounded-xl text-sm font-bold transition shadow-sm ${state.currentLocation === 'CIE' ? 'bg-white text-indigo-950' : 'bg-indigo-800 text-indigo-200 hover:bg-indigo-700'}">
                                <i class="fa-solid fa-building-shield mr-1.5"></i> Sede CIE
                            </button>
                        </div>

                        <!-- Seccion Toggle -->
                        <div class="flex items-center gap-2">
                            <span class="text-xs uppercase tracking-wider text-indigo-300 font-semibold mr-1">Sección:</span>
                            <button onclick="switchSection('hospitalarios')" class="px-3.5 py-2 rounded-xl text-xs font-semibold transition ${state.currentSection === 'hospitalarios' ? 'bg-indigo-600 text-white shadow' : 'bg-indigo-800/60 text-indigo-200 hover:bg-indigo-700'}">
                                <i class="fa-solid fa-kit-medical mr-1"></i> Productos Hospitalarios
                            </button>
                            <button onclick="switchSection('comercializadora')" class="px-3.5 py-2 rounded-xl text-xs font-semibold transition ${state.currentSection === 'comercializadora' ? 'bg-indigo-600 text-white shadow' : 'bg-indigo-800/60 text-indigo-200 hover:bg-indigo-700'}">
                                <i class="fa-solid fa-store mr-1"></i> Comercializadora
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Navigation Tabs -->
                <div class="bg-white border-b border-slate-200 shadow-sm">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex overflow-x-auto">
                        <button onclick="switchTab('inventario')" class="py-4 px-5 border-b-2 font-semibold text-sm flex items-center gap-2 whitespace-nowrap transition ${state.currentTab === 'inventario' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800'}">
                            <i class="fa-solid fa-boxes-column"></i> Inventario Actual
                        </button>
                        <button onclick="switchTab('pedido')" class="py-4 px-5 border-b-2 font-semibold text-sm flex items-center gap-2 whitespace-nowrap transition ${state.currentTab === 'pedido' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800'}">
                            <i class="fa-solid fa-cart-plus"></i> Realizar Pedido
                        </button>
                        <button onclick="switchTab('seguimiento')" class="py-4 px-5 border-b-2 font-semibold text-sm flex items-center gap-2 whitespace-nowrap transition ${state.currentTab === 'seguimiento' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800'}">
                            <i class="fa-solid fa-clipboard-check"></i> Recepción y Pendientes
                        </button>
                        ${isAdmin ? `
                        <button onclick="switchTab('reportes')" class="py-4 px-5 border-b-2 font-semibold text-sm flex items-center gap-2 whitespace-nowrap transition relative ${state.currentTab === 'reportes' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800'}">
                            <i class="fa-solid fa-chart-line"></i> Panel Admin & Reportes
                            ${unreadNotifs > 0 ? `<span class="ml-1 px-1.5 py-0.5 bg-rose-600 text-white rounded-full text-[10px]">${unreadNotifs}</span>` : ''}
                        </button>
                        ` : ''}
                    </div>
                </div>

                <!-- Content Body -->
                <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
                    <div class="bg-indigo-50/50 border border-indigo-100 rounded-2xl p-4 mb-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                        <div class="flex items-center gap-3">
                            <div class="p-3 bg-indigo-600 text-white rounded-xl">
                                <i class="fa-solid fa-location-dot"></i>
                            </div>
                            <div>
                                <h3 class="text-sm font-bold text-slate-800">Vista Actual: Sede <span class="text-indigo-600">${state.currentLocation}</span> / Sección <span class="text-indigo-600 uppercase">${state.currentSection}</span></h3>
                                <p class="text-xs text-slate-500">Los datos mostrados corresponden exclusivamente a esta selección y sede.</p>
                            </div>
                        </div>
                        <div class="text-xs font-semibold bg-white px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 shadow-sm">
                            Usuario: ${state.currentUser.name}
                        </div>
                    </div>

                    ${renderTabContent()}
                </main>
            `;
        }

        function switchLocation(loc) {
            state.currentLocation = loc;
            saveState();
            render();
        }

        function switchSection(sec) {
            state.currentSection = sec;
            saveState();
            render();
        }

        function switchTab(tab) {
            state.currentTab = tab;
            if(tab === 'reportes' && state.currentUser.role === 'admin') {
                state.notifications.forEach(n => n.read = true);
                saveState();
            }
            render();
        }

        function renderTabContent() {
            switch(state.currentTab) {
                case 'inventario': return renderInventoryTab();
                case 'pedido': return renderOrderTab();
                case 'seguimiento': return renderTrackingTab();
                case 'reportes': return renderReportsTab();
                default: return renderInventoryTab();
            }
        }

        // --- PASSWORD CHANGE MODAL (ADMIN) ---
        function openChangePasswordModal() {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 border border-slate-200 animate-in fade-in zoom-in duration-200">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="font-bold text-lg text-slate-800">Cambiar Contraseña de Administrador</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <form onsubmit="handlePasswordChange(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Nueva Contraseña</label>
                                <input type="password" id="new-admin-pass" required placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Confirmar Nueva Contraseña</label>
                                <input type="password" id="confirm-admin-pass" required placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-600">
                            </div>
                            <div class="flex items-center justify-end gap-3 mt-6">
                                <button type="button" onclick="closeModal()" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl transition">Cancelar</button>
                                <button type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-md transition">Actualizar Contraseña</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function handlePasswordChange(e) {
            e.preventDefault();
            const p1 = document.getElementById('new-admin-pass').value.trim();
            const p2 = document.getElementById('confirm-admin-pass').value.trim();

            if (p1 !== p2) {
                showToast('Las contraseñas no coinciden.', 'error');
                return;
            }

            state.currentUser.password = p1;

        function downloadBulkTemplate() {
            const templateData = [
                { Codigo: "HOS-200", Nombre: "Ejemplo Insumo Hospitalario 1", Cantidad: 100, StockMinimo: 20 },
                { Codigo: "HOS-201", Nombre: "Ejemplo Insumo Hospitalario 2", Cantidad: 50, StockMinimo: 10 }
            ];
            const ws = XLSX.utils.json_to_sheet(templateData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "PlantillaInsumos");
            XLSX.writeFile(wb, `Plantilla_Carga_Masiva_${state.currentLocation}_${state.currentSection}.xlsx`);
            showToast('Plantilla descargada con éxito.');
        }

        function processBulkUploadFile() {
            const fileInput = document.getElementById('bulk-excel-file');
            if (!fileInput.files || fileInput.files.length === 0) {
                showToast('Por favor selecciona un archivo Excel.', 'error');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet);

                    if (jsonRows.length === 0) {
                        showToast('El archivo Excel está vacío.', 'error');
                        return;
                    }

                    const list = state.inventory[state.currentLocation][state.currentSection];
                    let addedCount = 0;
                    let updatedCount = 0;

                    jsonRows.forEach(row => {
                        const code = String(row['Codigo'] || row['Código'] || row['codigo'] || row['CODE'] || '').trim().toUpperCase();
                        const name = String(row['Nombre'] || row['nombre'] || row['NAME'] || '').trim();
                        const quantity = parseInt(row['Cantidad'] || row['cantidad'] || row['QTY'] || 0);
                        const minStock = parseInt(row['StockMinimo'] || row['stockminimo'] || row['MinStock'] || 20);

                        if (code && name) {
                            const existing = list.find(i => i.code === code);
                            if (existing) {
                                existing.name = name;
                                existing.quantity += isNaN(quantity) ? 0 : quantity;
                                existing.minStock = isNaN(minStock) ? existing.minStock : minStock;
                                updatedCount++;
                            } else {
                                list.push({
                                    code: code,
                                    name: name,
                                    quantity: isNaN(quantity) ? 0 : quantity,
                                    minStock: isNaN(minStock) ? 20 : minStock
                                });
                                addedCount++;
                            }
                        }
                    });

                    saveState();
                    closeModal();
                    showToast(`¡Carga masiva completada! Se agregaron ${addedCount} nuevos insumos y se actualizaron ${updatedCount}.`);
                    render();
                } catch (err) {
                    console.error(err);
                    showToast('Error al leer el archivo Excel. Verifique el formato.', 'error');
                }
            };

            reader.readAsArrayBuffer(file);
        }

        function renderOrderProductsOnly() {
            const container = document.getElementById('order-products-container');
            if(container) {
                const items = state.inventory[state.currentLocation][state.currentSection];
                const filtered = items.filter(i => 
                    i.code.toLowerCase().includes(orderSearchQuery.toLowerCase()) || 
                    i.name.toLowerCase().includes(orderSearchQuery.toLowerCase())
                );
                container.innerHTML = renderOrderProductsHTML(filtered);
            }
        }

        function renderOrderProductsHTML(items) {
            if (items.length === 0) {
                return `<div class="py-8 text-center text-slate-400 text-xs">No hay insumos coincidentes.</div>`;
            }

            return `
                <div class="space-y-3">
                    ${items.map(item => `

                                </button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function addToCart(code, name) {
            const qtyInput = document.getElementById(`qty-${code}`);
            const qty = parseInt(qtyInput.value);
            if (isNaN(qty) || qty <= 0) {
                showToast('Por favor ingresa una cantidad válida.', 'error');
                return;
            }

            const existing = state.cart.find(i => i.code === code);
            if (existing) {
                existing.qty += qty;
            } else {
                state.cart.push({ code, name, qty });
            }
            showToast(`Insumo ${code} añadido al carrito.`);
            render();
        }

        function removeFromCart(idx) {
            state.cart.splice(idx, 1);
            render();
        }

        function submitOrder() {
            if (state.cart.length === 0) return;

            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const timeStr = now.toTimeString().split(' ')[0];

            const orderItems = state.cart.map(i => ({
                code: i.code,
                name: i.name,
                orderedQty: i.qty,
                deliveredQty: 0,
                pendingQty: i.qty
            }));

            const newOrder = {
                id: 'ORD-' + Math.floor(100000 + Math.random() * 900000),
                location: state.currentLocation,
                section: state.currentSection,
                userName: state.currentUser.name,
                userDoc: state.currentUser.document || state.currentUser.username,
                date: dateStr,
                time: timeStr,
                items: orderItems,
                status: 'Pendiente'
            };

            state.orders.unshift(newOrder);

            state.notifications.unshift({
                id: 'NOTIF-' + Date.now(),
                orderId: newOrder.id,
                message: `${state.currentUser.name} realizó un pedido (${newOrder.id}) en Sede ${state.currentLocation} / ${state.currentSection}.`,
                location: state.currentLocation,
                section: state.currentSection,
                user: state.currentUser.name,
                date: dateStr,
                time: timeStr,
                read: false
            });

            state.cart = [];
            saveState();
            syncOrderToCloud(newOrder);
            showToast('¡Pedido realizado con éxito y notificación enviada al administrador!');
            switchTab('seguimiento');
        }

        function openReceptionModal(orderId) {

        function handleSaveReception(e, orderId) {
            e.preventDefault();
            const order = state.orders.find(o => o.id === orderId);
            if (!order) return;

            let allCompleted = true;

            order.items.forEach((item, idx) => {
                const arrivedInput = document.getElementById(`arrived-${idx}`);
                const arrivedNow = parseInt(arrivedInput.value) || 0;

                if (arrivedNow > 0) {
                    item.deliveredQty += arrivedNow;
                    item.pendingQty -= arrivedNow;

                    const invItem = state.inventory[order.location][order.section].find(i => i.code === item.code);
                    if (invItem) {
                        invItem.quantity += arrivedNow;
                    }
                }

                if (item.pendingQty > 0) {
                    allCompleted = false;
                }
            });

            order.status = allCompleted ? 'Completado' : 'Parcial';

            saveState();
            closeModal();
            showToast('¡Recepción registrada y stock actualizado con éxito!');
            render();
        }

        // --- TAB 4: PANEL ADMIN & REPORTES ---
        function renderReportsTab() {
            const orders = state.orders;
            const monthlyStats = {};
            let totalRequestedAllTime = 0;

            orders.forEach(ord => {
                const monthKey = ord.date.substring(0, 7);
                if (!monthlyStats[monthKey]) {
                    monthlyStats[monthKey] = { totalOrders: 0, totalItems: 0 };
                }
                monthlyStats[monthKey].totalOrders += 1;
                ord.items.forEach(it => {
                    monthlyStats[monthKey].totalItems += it.orderedQty;
                    totalRequestedAllTime += it.orderedQty;
                });
            });

            const monthsCount = Object.keys(monthlyStats).length || 1;
            const monthlyAverage = Math.round(totalRequestedAllTime / monthsCount);
            const currentYear = new Date().getFullYear().toString();
            let annualTotal = 0;
            Object.keys(monthlyStats).forEach(mk => {
                if (mk.startsWith(currentYear)) {
                    annualTotal += monthlyStats[mk].totalItems;
                }
            });

            return `

                    <!-- Analytics Grid (Clickable Cards) -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div onclick="openYearlyReportModal()" class="cursor-pointer bg-white rounded-2xl p-6 shadow-sm border border-slate-200 hover:border-indigo-600 hover:shadow-md transition flex items-center gap-4 group">

                            </div>
                            <div>

                                <h4 class="text-2xl font-bold text-slate-800 mt-1">${monthlyAverage} <span class="text-xs font-medium text-slate-500">insumos/mes</span></h4>
                            </div>

                        <div onclick="openAllOrdersReportModal()" class="cursor-pointer bg-white rounded-2xl p-6 shadow-sm border border-slate-200 hover:border-blue-600 hover:shadow-md transition flex items-center gap-4 group">

                            <div>
                                <p class="text-xs uppercase tracking-wider font-semibold text-slate-400">Total Pedidos Realizados <i class="fa-solid fa-arrow-up-right-from-square text-[10px] ml-1"></i></p>
                                <h4 class="text-2xl font-bold text-slate-800 mt-1">${orders.length} <span class="text-xs font-medium text-slate-500">órdenes</span></h4>
                            </div>
                        </div>
                    </div>

                    <!-- Notifications & Activity Log -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

                                <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
                                    <i class="fa-solid fa-bell text-indigo-600"></i> Notificaciones de Pedidos Recientes

                const notif = state.notifications.find(n => n.id === notifId);
                if (notif) orderId = notif.orderId;
            } else if (notifId.startsWith('PSEUDO-')) {
                orderId = notifId.replace('PSEUDO-', '');

            const order = state.orders.find(o => o.id === orderId);
            if (!order) return;

            const modal = document.getElementById('modal-container');

        function downloadCSV(filename, csvContent) {
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', filename);
            a.style.visibility = 'hidden';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast('¡Reporte exportado en formato Excel (.xlsx) con éxito!');
        }
